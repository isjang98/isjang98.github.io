name: 말씀온 SEO 정합성

on:
  push:
    paths:
      - "BibleOn/**"
      - ".github/workflows/bibleon-seo.yml"
  pull_request:
    paths:
      - "BibleOn/**"
      - ".github/workflows/bibleon-seo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-localized-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 검증 의존성 설치
        run: pip install -r BibleOn/tools/requirements-dev.txt

      - name: 영어 정적 HTML 생성 상태 확인
        run: python BibleOn/tools/build_en.py --check

      - name: 언어별 HTML 회귀 테스트
        run: pytest BibleOn/tools/test_build_en.py
